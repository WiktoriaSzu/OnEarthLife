<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>On Earth Life</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div class="contact-bar">contact:<br>onearthlifefromvenus@gmail.com</div>
    <main>
        <div class="h1-row">
            <h1>Welcome<span class="h1-exclaim">!</span></h1>
            <img src="static/img/ziemianagore.jpeg" alt="Planeta" class="h1-planet">
        </div>
        <hr class="divider">
        <img src="static/img/onearth napis.jpeg" alt="ON Earth Life" class="banner-img">
        <div class="page-body">
            <div class="page-right">
                <p>Monthly scientific and informatory magazine. Our Worlds knowledge in comprehensible words.</p>
                <p><span style="color: #d4788a;">Big topics, meaningfull to all.</span> Easy and free access for all.</p>
                <div class="carousel-section">
                    <div class="carousel-labels">
                        <p class="carousel-hint">All the latest magazines</p>
                        <p class="carousel-hint-sub">CLICK COVER TO DOWNLOAD</p>
                    </div>
                    <span class="carousel-arrow">&#10230;</span>
                    <div class="carousel-groups">
                        <div class="carousels-row">
                            <span class="carousel-language">EN</span>
                            <div class="carousel">
                                <div class="image-row" id="imageRowEng">
                                    <div class="cover-wrap">
                                        <img src="static/files/01shortencover.jfif" alt="Short English cover" data-pdf="static/files/01shorten.pdf">
                                    </div>
                                    <div class="cover-wrap">
                                        <img src="static/files/01encover.jfif" alt="English cover" data-pdf="static/files/01en.pdf">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="carousels-row">
                            <span class="carousel-language">PL</span>
                            <div class="carousel">
                                <div class="image-row" id="imageRowPl">
                                    <div class="cover-wrap">
                                        <img src="static/files/01shortplcover.jfif" alt="Short Polish cover" data-pdf="static/files/01shortpl.pdf">
                                    </div>
                                    <div class="cover-wrap">
                                        <img src="static/files/01plcover.jfif" alt="Polish cover" data-pdf="static/files/01pl.pdf">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">&times;</button>
            <img id="lightboxImg" src="" alt="">
            <a class="lightbox-download" id="lightboxDownload" href="static/files/oelmag0108.pdf" download>&#8659; Download</a>
        </div>
    </div>

    <script type="module" src="./script.ts"></script>
  </body>
</html>
