<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>On Earth Life</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div class="contact-bar">contact:<br>onearthlifefromvenus@gmail.com</div>
    <main>
        <div class="h1-row">
            <h1>Welcome<span class="h1-exclaim">!</span></h1>
            <img src="static/img/ziemianagore.jpeg" alt="Planeta" class="h1-planet">
            <div class="h1-planets-right">
                <div class="h1-planet-label">
                    <img src="static/img/czerwonaplaneta.png" alt="Czerwona Planeta" class="h1-planet-small">
                    <span>From Venus</span>
                </div>
                <span class="h1-planet-by">by</span>
                <div class="h1-planet-label">
                    <img src="static/img/jingnagorestrony.jpeg" alt="Jingjang" class="h1-planet-medium">
                    <span>Aeria Lilith</span>
                </div>
            </div>
        </div>
        <hr class="divider">
        <img src="static/img/onearth napis.jpeg" alt="ON Earth Life" class="banner-img">
        <div class="page-body">
            <div class="page-right">
                <p>Monthly scientific and informatory magazine. Our Worlds knowledge in comprehensible words.</p>
                <p><span style="color: #d4788a;">Big topics, meaningfull to all.</span> Easy and free access for all.</p>
                <div class="carousel-section">
                    <div class="carousel-labels">
                        <p class="carousel-hint">All the latest magazines</p>
                        <p class="carousel-hint-sub">CLICK COVER TO DOWNLOAD</p>
                    </div>
                    <span class="carousel-arrow">&#10230;</span>
                    <div class="carousel">
                        <button class="carousel-btn left" id="scrollLeft">&#8249;</button>
                        <div class="image-row" id="imageRow">
                        <img src="static/img/coveraugust.png" alt="August cover">
                        </div>
                        <button class="carousel-btn right" id="scrollRight">&#8250;</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">&times;</button>
            <img id="lightboxImg" src="" alt="">
            <a class="lightbox-download" id="lightboxDownload" href="static/files/magazineaugust%20(2).pdf" download>&#8659; Download</a>
        </div>
    </div>

    <script type="module" src="./script.ts"></script>
  </body>
</html>
